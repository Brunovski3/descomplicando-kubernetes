apiVersion: v1
kind: Pod
metadata:
  labels:
    run: pod-exame
  name: pod-exame
spec:
  containers:
  - image: nginx
    name: pod-exame
    args:
    - sleep
    - "600"
    volumeMounts:
    - mountPath: /giropops
      name: exame-emptydir
    resources:
      limits:
        cpu: "0.5"
        memory: "256Mi"
      requests:
        cpu: "0.3"
        memory: "128Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  volumes:
  - name: exame-emptydir
    emptyDir:
      sizeLimit: 256Mi
status: {}
