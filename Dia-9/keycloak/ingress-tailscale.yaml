apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-tailscale
  namespace: keycloak
  annotations:
    tailscale.com/proxy-group: "ingress-proxies"
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [keycloak]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-keycloakx-http
                port:
                  number: 8080
